  .controls button { width:38px; height:38px; border-radius:10px; border:1px solid var(--hair);

    cursor:pointer; display:grid; place-items:center; }
  .controls button:hover { color:var(--text); }
  .controls button.fit { font-size:11px; font-weight:700; letter-spacing:.04em; }
  .hint { position:absolute; left:14px; bottom:16px; font-family:var(--mono); font-size:10.5px;

  }
