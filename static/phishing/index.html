<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phish Lab — Phishing Awareness Training</title>
<style>
/* ============================================================
   PHISH LAB — a training inbox
   Chrome = dark instrument.  Email = light paper sheet.
   Signature = the forensic markup pass on verdict.
   No external assets: works offline, double-click to open.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
[hidden]{display:none!important}

:root{
  --ink:#0F141A;      /* desk */
  --ink2:#161D25;     /* panel */
  --ink3:#1F2833;     /* raised */
  --line:#2A3542;
  --line2:#374453;
  --text:#E6ECF3;
  --dim:#8A98A8;
  --dim2:#61707F;

  --paper:#FFFFFF;    /* the email */
  --paper2:#F4F7F9;
  --pline:#E2E8ED;
  --ptext:#1A222C;
  --pdim:#5D6C7B;

  --flag:#FFB224;     /* highlighter — red flags */
  --hot:#FF5C45;      /* phishing */
  --safe:#28C387;     /* legitimate / green flags */
  --focus:#6BA5FF;

  --ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --mail:Arial,"Helvetica Neue",Helvetica,sans-serif;

  --rail:54px;
}

body{
  background:var(--ink);color:var(--text);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

.mlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.mono{font-family:var(--mono)}

/* ---------- rail ---------- */
.rail{
  position:sticky;top:0;z-index:60;height:var(--rail);
  display:flex;align-items:center;gap:16px;padding:0 16px;
  background:rgba(15,20,26,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.mark{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:4px}
.mark:hover{background:var(--ink2)}
.mark .dot{width:9px;height:9px;background:var(--flag);transform:rotate(45deg);flex:none}
.mark .wm{font-size:13px;font-weight:750;letter-spacing:-.01em}
.mark .wm span{color:var(--dim);font-weight:500}

.sim{
  font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--flag);
  border:1px dashed rgba(255,178,36,.5);padding:4px 8px;border-radius:2px;white-space:nowrap;
}
.rail .spacer{flex:1}

.tabs{display:flex;gap:3px}
.tab{
  min-width:30px;height:30px;padding:0 9px;border:0;border-radius:4px;background:transparent;
  color:var(--dim);font-size:12px;font-weight:650;cursor:pointer;letter-spacing:.02em;
}
.tab:hover{background:var(--ink2);color:var(--text)}
.tab[aria-current="true"]{background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.tab .done{color:var(--safe)}

.counter{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.pips{display:flex;gap:3px;margin-left:8px}
.pip{width:5px;height:5px;border-radius:50%;background:var(--line2)}
.pip.on{background:var(--dim)}

.ghost{
  background:transparent;border:1px solid var(--line2);color:var(--dim);
  padding:5px 10px;border-radius:4px;font-size:11.5px;cursor:pointer;
}
.ghost:hover{border-color:var(--dim2);color:var(--text)}

/* ---------- start screen ---------- */
.start{max-width:940px;margin:0 auto;padding:56px 24px 80px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.eyebrow .rule{height:1px;flex:1;background:var(--line)}
.start h1{
  font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.035em;
  font-weight:780;margin:0 0 18px;max-width:15ch;
}
.start h1 em{font-style:normal;color:var(--flag)}
.lede{font-size:16.5px;line-height:1.6;color:var(--dim);max-width:60ch;margin:0 0 34px}
.lede strong{color:var(--text);font-weight:600}

/* the thesis, shown literally */
.exhibit{
  background:var(--paper);border-radius:5px;padding:20px 22px;max-width:560px;
  box-shadow:0 20px 44px -24px rgba(0,0,0,.8);margin-bottom:14px;
}
.exhibit .ex-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--pdim);font-weight:700;margin-bottom:9px}
.exhibit .ex-row{font-family:var(--mail);color:var(--ptext);font-size:14.5px;line-height:2}
.exhibit .ex-row b{font-weight:700}
.ex-cap{font-size:12px;color:var(--dim2);max-width:560px;margin:0 0 40px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:40px}
.step{background:var(--ink);padding:18px 20px}
.step .n{font-family:var(--mono);font-size:11px;color:var(--flag);margin-bottom:8px}
.step h3{margin:0 0 5px;font-size:14px;font-weight:650}
.step p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.55}

.lv-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.lv-head h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.lv-head span{font-size:12px;color:var(--dim2)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:34px}
.lcard{
  text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:7px;
  padding:16px;cursor:pointer;transition:border-color .16s,transform .16s,background .16s;
}
.lcard:hover{border-color:var(--line2);background:var(--ink3);transform:translateY(-2px)}
.lcard .lv{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.lcard h4{margin:0 0 6px;font-size:14.5px;font-weight:680;letter-spacing:-.01em}
.lcard p{margin:0;font-size:12px;color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:6;line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.lcard .bars{display:flex;gap:3px;margin-top:12px}
.lcard .bars i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.lcard .bars i.f{background:var(--flag)}
.lcard .tick{color:var(--safe);font-size:12px}

.note{border-left:2px solid var(--line2);padding:2px 0 2px 14px;color:var(--dim2);font-size:12.5px;line-height:1.6;max-width:70ch}
.note b{color:var(--dim);font-weight:600}

/* ---------- split view ---------- */
.split{display:grid;grid-template-columns:minmax(320px,376px) 1fr;height:calc(100vh - var(--rail));}
.list{overflow-y:auto;border-right:1px solid var(--line);background:var(--ink)}
.list-head{
  position:sticky;top:0;z-index:5;background:var(--ink);padding:15px 16px 11px;border-bottom:1px solid var(--line);
}
.list-head h2{margin:0 0 3px;font-size:14.5px;font-weight:680;letter-spacing:-.01em}
.list-head p{margin:0;font-size:12px;color:var(--dim);line-height:1.5}

.item{
  width:100%;text-align:left;display:grid;grid-template-columns:32px 1fr;gap:11px;
  padding:13px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);
  cursor:pointer;position:relative;
}
.item:hover{background:var(--ink2)}
.item[aria-selected="true"]{background:var(--ink3)}
.item[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--flag)}
.item.answered .i-from,.item.answered .i-sub{color:var(--dim)}
.tile{
  width:32px;height:32px;border-radius:6px;display:grid;place-items:center;
  font-size:13px;font-weight:750;color:#fff;flex:none;
}
.i-main{min-width:0}
.i-top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;min-width:0}
.i-from{display:block;min-width:0;font-size:13px;font-weight:650;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-date{margin-left:auto;font-size:10.5px;color:var(--dim2);white-space:nowrap;flex:none}
.i-sub{display:block;font-size:12.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-pre{display:block;font-size:11.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-chip{
  display:inline-flex;align-items:center;gap:4px;margin-top:7px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:3px;
}
.i-chip.ok{background:rgba(40,195,135,.14);color:var(--safe)}
.i-chip.no{background:rgba(255,92,69,.14);color:var(--hot)}

/* ---------- reading pane ---------- */
.pane{overflow-y:auto;position:relative;scroll-behavior:smooth}
.pane-inner{padding:0 26px 26px;max-width:832px;margin:0 auto}

.banner{
  display:flex;gap:13px;align-items:flex-start;margin:24px 0 0;padding:14px 16px;
  border-radius:6px;border:1px solid;font-size:13.5px;line-height:1.55;
}
.banner .bi{font-size:15px;line-height:1.2;flex:none}
.banner b{display:block;font-size:13px;letter-spacing:.01em;margin-bottom:2px}
.banner.right{background:rgba(40,195,135,.09);border-color:rgba(40,195,135,.32);color:#B8EED8}
.banner.right b{color:var(--safe)}
.banner.wrong{background:rgba(255,178,36,.08);border-color:rgba(255,178,36,.32);color:#F2DCB4}
.banner.wrong b{color:var(--flag)}

/* the sheet — an email is a document */
.sheet{
  background:var(--paper);color:var(--ptext);border-radius:5px;margin:22px 0 0;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.5),0 24px 52px -28px rgba(0,0,0,.85);
}
.sheet-top{padding:22px 26px 0}
.sheet h1{font-size:19px;line-height:1.35;font-weight:650;letter-spacing:-.012em;margin:0 0 16px;color:var(--ptext)}
.hrow{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.hrow .tile{width:38px;height:38px;border-radius:50%;font-size:15px}
.hmain{min-width:0}
.hline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:13.5px}
.hname{font-weight:700;color:var(--ptext)}
.haddr{font-family:var(--mono);font-size:12px;color:var(--pdim);word-break:break-all}
.hto{font-size:12px;color:var(--pdim);margin-top:2px;display:flex;align-items:center;gap:6px}
.hdate{font-size:12px;color:var(--pdim);white-space:nowrap;margin-left:auto}
.dtoggle{
  background:transparent;border:0;padding:1px 4px;border-radius:3px;cursor:pointer;
  color:var(--pdim);font-size:11px;font-weight:600;
}
.dtoggle:hover{background:var(--paper2);color:var(--ptext)}
.details{
  margin:12px 0 0;padding:11px 13px;background:var(--paper2);border:1px solid var(--pline);border-radius:4px;
  font-family:var(--mono);font-size:11.5px;line-height:1.85;color:var(--pdim);
}
.details .k{display:inline-block;min-width:88px;color:#8595A4}
.details .v{color:var(--ptext);word-break:break-all}
.inspbtn{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--paper);
  border:1px solid var(--pline);color:var(--pdim);padding:5px 11px;border-radius:4px;
  font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--ui);
}
.inspbtn:hover{border-color:#C6D0D8;color:var(--ptext)}
.insp{margin-top:10px;border:1px solid var(--pline);border-radius:4px;overflow:hidden}
.insp-h{padding:8px 12px;background:#EEF2F5;border-bottom:1px solid var(--pline);
  font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pdim)}
.insp-row{padding:9px 12px;border-top:1px solid var(--pline);font-family:var(--mono);font-size:11.5px}
.insp-row:first-of-type{border-top:0}
.insp-w{display:block;font-family:var(--ui);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:#8E9CA9;margin-bottom:3px}
.insp-host{color:var(--ptext);word-break:break-all}
.insp-bad{margin-top:6px;padding:7px 9px;border-radius:3px;background:#FFF1EE;border:1px solid #FFCFC4;
  font-family:var(--ui);font-size:11.5px;line-height:1.5;color:#8C2A18}
.insp-bad code{font-family:var(--mono);font-size:11px;background:#FFE2DB;padding:1px 4px;border-radius:2px}
.insp-ok{margin-top:5px;font-family:var(--ui);font-size:11.5px;color:#3F7D5E}
.mail{
  font-family:var(--mail);font-size:14.5px;line-height:1.62;color:#2A333D;
  padding:20px 26px 28px;margin-top:18px;border-top:1px solid var(--pline);
}
.mail p{margin:0 0 13px}
.mail ul{margin:0 0 13px;padding-left:22px}
.mail li{margin-bottom:5px}
.mail strong{color:#161D24}
.mail a.lnk{color:var(--bbrand,#1A73E8);text-decoration:underline;cursor:pointer}
.mail a.btn{
  display:inline-block;background:var(--bbrand,#1A73E8);color:#fff;text-decoration:none;
  padding:11px 22px;border-radius:4px;font-weight:700;font-size:14px;margin:4px 0 8px;cursor:pointer;
}
.mail a.btn:hover{filter:brightness(1.08)}
.mail .sig{color:var(--pdim);font-size:13px}

/* ---------- forensic markup ---------- */
.mk{position:relative;border-radius:2px;padding:0 1px}
.mk.flagged{box-shadow:inset 0 -.62em 0 rgba(255,178,36,.42)}
.mk.green{box-shadow:inset 0 -.62em 0 rgba(40,195,135,.34)}
.mk.blk{display:inline-block;box-shadow:none;outline:2px dashed rgba(255,178,36,.85);outline-offset:4px;border-radius:5px}
.mk.blk.green{outline-color:rgba(40,195,135,.85)}
.mk::after{
  content:attr(data-n);position:absolute;top:-9px;right:-11px;
  width:17px;height:17px;border-radius:50%;background:var(--flag);color:#231700;
  font:750 10px/17px var(--ui);text-align:center;letter-spacing:0;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.mk.green::after{background:var(--safe);color:#032117}
.mk.pulse{box-shadow:inset 0 -.62em 0 rgba(255,178,36,.85)}
.mk.green.pulse{box-shadow:inset 0 -.62em 0 rgba(40,195,135,.8)}
.mk.blk.pulse{box-shadow:none;outline-style:solid}
.reveal .mk{animation:mkin .34s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes mkin{from{box-shadow:inset 0 -.62em 0 rgba(255,178,36,0);opacity:.55}}

/* ---------- findings ---------- */
.findings{margin:26px 0 0;border:1px solid var(--line);border-radius:7px;background:var(--ink2);overflow:hidden}
.f-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.f-head h3{margin:0;font-size:13px;font-weight:680;letter-spacing:-.005em}
.f-head .badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.badge.phish{background:rgba(255,92,69,.15);color:var(--hot)}
.badge.legit{background:rgba(40,195,135,.15);color:var(--safe)}
.finding{
  display:grid;grid-template-columns:20px 1fr;gap:13px;padding:14px 18px;
  border-top:1px solid var(--line);cursor:default;
}
.finding:first-of-type{border-top:0}
.finding:hover{background:var(--ink3)}
.fnum{
  width:20px;height:20px;border-radius:50%;background:var(--flag);color:#231700;
  font-size:10.5px;font-weight:750;display:grid;place-items:center;margin-top:1px;
}
.finding.green .fnum{background:var(--safe);color:#032117}
.f-label{font-size:13.5px;font-weight:650;margin-bottom:6px;letter-spacing:-.005em}
.f-ev{
  display:inline-block;font-family:var(--mono);font-size:11.5px;
  background:rgba(255,178,36,.09);color:var(--flag);border:1px solid rgba(255,178,36,.2);
  padding:2px 7px;border-radius:3px;margin-bottom:7px;word-break:break-all;max-width:100%;
}
.finding.green .f-ev{background:rgba(40,195,135,.09);color:var(--safe);border-color:rgba(40,195,135,.2)}
.f-exp{font-size:13px;color:var(--dim);line-height:1.6}
.f-dest{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
.f-dest .dl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);flex:none}
.f-dest .du{font-family:var(--mono);font-size:11.5px;color:var(--hot);word-break:break-all}
.f-puny{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-top:9px;padding:8px 10px;border-radius:4px;background:rgba(255,92,69,.07);border:1px solid rgba(255,92,69,.18)}
.f-puny .pl{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hot);flex:none}
.f-puny .pu{font-family:var(--mono);font-size:11.5px;color:#FFCFC7;word-break:break-all}
.finding.green .f-dest .du{color:var(--safe)}
.takeaway{display:flex;gap:11px;padding:15px 18px;border-top:1px solid var(--line);background:var(--ink3);font-size:13px;line-height:1.55}
.takeaway .tl{color:var(--flag);flex:none;font-weight:700}

.next{display:flex;gap:10px;align-items:center;margin:20px 0 0;flex-wrap:wrap}
.pbtn{
  background:var(--flag);color:#231700;border:0;padding:11px 20px;border-radius:5px;
  font-size:13.5px;font-weight:700;cursor:pointer;letter-spacing:-.005em;
}
.pbtn:hover{filter:brightness(1.07)}
.pbtn.alt{background:var(--ink3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.pbtn.alt:hover{background:#28323F;filter:none}

/* ---------- verdict bar ---------- */
.verdict{
  position:sticky;bottom:0;z-index:20;margin-top:26px;padding:20px 0 22px;
  background:linear-gradient(to top,var(--ink) 58%,rgba(15,20,26,0));
  display:flex;gap:11px;align-items:center;justify-content:center;flex-wrap:wrap;
}
.verdict .q{font-size:12.5px;color:var(--dim);margin-right:4px}
.vbtn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:6px;
  font-size:14px;font-weight:680;cursor:pointer;border:1px solid;background:var(--ink2);
  transition:transform .13s,background .13s;
}
.vbtn:hover{transform:translateY(-1px)}
.vbtn.phish{border-color:rgba(255,92,69,.4);color:#FFB0A3}
.vbtn.phish:hover{background:rgba(255,92,69,.14);border-color:var(--hot)}
.vbtn.legit{border-color:rgba(40,195,135,.4);color:#9FE9CB}
.vbtn.legit:hover{background:rgba(40,195,135,.14);border-color:var(--safe)}
.kbd{font-family:var(--mono);font-size:10px;opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 4px;line-height:15px}

.empty{display:grid;place-items:center;height:100%;padding:40px;text-align:center;color:var(--dim2)}
.empty p{max-width:34ch;font-size:13.5px;line-height:1.6}

/* ---------- debrief ---------- */
.debrief{max-width:800px;margin:0 auto;padding:46px 26px 70px}
.debrief h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;font-weight:760;margin:0 0 12px;line-height:1.08}
.debrief .sub{color:var(--dim);font-size:15px;margin:0 0 34px;max-width:58ch;line-height:1.6}
.dpoints{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:32px}
.dpoints .dh{padding:13px 18px;background:var(--ink2);border-bottom:1px solid var(--line)}
.dpoint{display:grid;grid-template-columns:16px 1fr;gap:13px;padding:13px 18px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;color:var(--text)}
.dpoint:first-of-type{border-top:0}
.dpoint .dk{color:var(--flag);font-weight:700;line-height:1.45}
.recap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:30px}
.recap .dh{padding:13px 18px;background:var(--ink2);border-bottom:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:13px 18px;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rmark{font-size:13px;line-height:1.5}
.rmark.ok{color:var(--safe)}
.rmark.no{color:var(--hot)}
.rsub{display:block;font-size:13px;font-weight:600;margin-bottom:3px;letter-spacing:-.005em}
.rtake{display:block;font-size:12.5px;color:var(--dim);line-height:1.55}
.rtag{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:3px;white-space:nowrap;margin-top:1px}
.rtag.phish{background:rgba(255,92,69,.14);color:var(--hot)}
.rtag.legit{background:rgba(40,195,135,.14);color:var(--safe)}

/* ---------- status bar (true link destination) ---------- */
.statusbar{
  position:fixed;left:0;bottom:0;z-index:90;max-width:min(74vw,760px);
  display:flex;align-items:center;gap:9px;
  background:#0A0E12;border:1px solid var(--line2);border-left:0;border-bottom:0;
  border-radius:0 6px 0 0;padding:8px 14px 8px 12px;box-shadow:0 -3px 18px rgba(0,0,0,.5);
}
.statusbar .sb-l{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);flex:none}
.statusbar .sb-u{font-family:var(--mono);font-size:12px;color:var(--flag);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:95;
  background:#0A0E12;border:1px solid var(--line2);border-radius:6px;padding:10px 16px;
  font-size:12.5px;color:var(--dim);box-shadow:0 8px 30px rgba(0,0,0,.6);
}
.toast b{color:var(--flag);font-weight:650}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .list{border-right:0;border-bottom:1px solid var(--line)}
  body[data-view="mail"] .list{display:none}
  body:not([data-view="mail"]) .pane{display:none}
  .split{height:auto;min-height:calc(100vh - var(--rail))}
  .pane-inner{padding:0 14px 20px}
  .sheet-top{padding:18px 17px 0}
  .mail{padding:18px 17px 24px}
  .rail{gap:10px;padding:0 11px}
  .rail .counter,.rail .pips{display:none}
  .sim{font-size:8.5px;letter-spacing:.1em;padding:3px 6px}
  .start{padding:38px 18px 60px}
  .statusbar{max-width:100vw;width:100%;border-radius:0;border-right:0}
  .tab{min-width:25px;height:26px;padding:0 5px;font-size:11px}
  .tabs{gap:2px}
  .rail [data-reset]{display:none}
  .mark{padding:4px 2px}
}
.backbtn{display:none}
@media (max-width:900px){.backbtn{display:inline-flex;align-items:center;gap:6px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

lass='btn' data-href='https://micros0ft-security.net/o365/keep-password' data-tell='t1'>Keep My Password<\/a><\/p><p><span class='tell' data-tell='t2'>Please do not forward this notice to your IT department, as duplicate requests will lock the mailbox.<\/span><\/p><p>Microsoft 365 Identity Services<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Zero-for-o lookalike domain", "evidence": "no-reply@micros0ft-security.net", "explanation": "'micros0ft' uses a zero in place of the letter o, and the real domain here is micros0ft-security.net — Microsoft mail comes from microsoft.com or accountprotection.microsoft.com."}, {"anchor": "replyto", "label": "Reply-to is a third, unrelated domain", "evidence": "support@ms-verify-desk.com", "explanation": "The From and Reply-To point at two different attacker domains. Legitimate senders reply to their own domain."}, {"anchor": "t1", "label": "Credential-harvest button", "evidence": "micros0ft-security.net/o365/keep-password", "explanation": "Microsoft never offers a 'keep my password' link by email. Password changes happen in the portal you navigate to yourself."}, {"anchor": "t2", "label": "Discourages contacting IT", "evidence": "Please do not forward this notice to your IT department", "explanation": "No real system warns you against involving your own helpdesk. Isolating the victim from anyone who could check the mail is a pure attacker move."}], "takeaway": "Password-expiry mail is the classic lure — go to the portal yourself and never click a 'keep my password' link."}, {"id": "l2-amazon", "brand": "Amazon", "brandKey": "amazon", "fromName": "Amazon.com", "fromAddress": "orders@amaz0n-support.com", "replyTo": null, "subject": "Order #114-8827391 confirmed — Apple MacBook Pro 16\" ($2,499.00)", "date": "Aug 27, 11:58 PM", "preview": "Hello, Thank you for your order. Your Apple MacBook Pro 16\" ($2,499.00) is being prepared for delivery...", "bodyHtml": "<p><span class='tell' data-tell='t1'>Hello,<\/span><\/p><p>Thank you for your order. Your <strong>Apple MacBook Pro 16\"<\/strong> ($2,499.00) is being prepared for delivery to an address in Bridgeport, CT.<\/p><p><span class='tell' data-tell='t2'>If you did not authorize this purchase, cancel it immediately using the link below — orders cannot be canceled once they enter dispatch.<\/span><\/p><p><a class='btn' data-href='https://amaz0n-support.com/cancel-order/114-8827391' data-tell='t3'>Cancel This Order<\/a><\/p><p>Alternatively call our billing desk on <span class='tell' data-tell='t4'>+1 (888) 402-7719<\/span> and quote your order number.<\/p><p>Amazon Customer Service<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Lookalike Amazon domain", "evidence": "orders@amaz0n-support.com", "explanation": "A zero replaces the o in amazon and '-support' is appended. The registered owner is amaz0n-support.com, not Amazon — real order mail comes from amazon.com addresses."}, {"anchor": "t1", "label": "Generic greeting on a supposedly personal order", "evidence": "Hello,", "explanation": "A retailer that just took a $2,499 order from you has your name on the account and uses it. A nameless greeting means the sender is blasting this to a list and does not know who you are."}, {"anchor": "t2", "label": "Panic lure over a purchase you never made", "evidence": "If you did not authorize this purchase, cancel it immediately", "explanation": "A big surprise charge plus a closing dispatch window is designed to make you click before you think. Check your real order history in the Amazon app instead — if there is no such order, there is nothing to cancel."}, {"anchor": "t3", "label": "Cancel button leads to the fake domain", "evidence": "amaz0n-support.com/cancel-order/114-8827391", "explanation": "The 'cancel' page is the phishing page — it will ask for your Amazon login or card details to 'verify' the refund. Hovering shows the same counterfeit host as the sender."}, {"anchor": "t4", "label": "Callback number planted in the email", "evidence": "+1 (888) 402-7719", "explanation": "A phone number printed inside a suspicious email reaches whoever sent it, not the brand. This is callback phishing: the 'agent' talks you through handing over card data or installing remote-access software. Only ever dial the number on your card, statement or the company's own site."}], "takeaway": "Never use the cancel link or the phone number inside a surprise order email — open the retailer's own app and check your orders."}, {"id": "l2-dhl", "brand": "UPS", "brandKey": "ups", "fromName": "UPS Delivery Services", "fromAddress": "notify@ups-parcel-services.com", "replyTo": null, "subject": "Delivery on hold: we could not verify the address for tracking 1Z8842W7039118", "date": "Aug 28, 7:34 AM", "preview": "Dear Customer, UPS was unable to verify the delivery address for tracking number 1Z8842W7039118...", "bodyHtml": "<p><span class='tell' data-tell='t1'>Dear Customer<\/span>,<\/p><p>UPS was unable to verify the delivery address for tracking number <strong>1Z8842W7039118<\/strong>, addressed to Northwind Trading Co. The package is on hold at our Secaucus, NJ sorting facility.<\/p><p>To release it for delivery, <span class='tell' data-tell='t2'>confirm the recipient's full name, delivery address and a contact phone number<\/span> using the link below. <span class='tell' data-tell='t3'>Packages not confirmed within 72 hours are returned to sender and the shipping charge is forfeited.<\/span><\/p><p><a class='btn' data-href='https://ups-parcel-services.com/track/address-confirm?id=1Z8842W7039118' data-tell='t4'>Confirm Delivery Address<\/a><\/p><p>Thank you for choosing UPS.<br>UPS Delivery Support<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Hyphen-extended lookalike of the carrier's domain", "evidence": "notify@ups-parcel-services.com", "explanation": "Read the domain right-to-left: the registered owner is ups-parcel-services.com, a domain anyone can buy. UPS sends from ups.com — bolting extra words onto a brand name with hyphens does not make it the brand."}, {"anchor": "t1", "label": "Generic greeting from a carrier holding your parcel", "evidence": "Dear Customer", "explanation": "A courier that genuinely has a package for you has the recipient name printed on the label. A nameless greeting means this was blasted to a mailing list in the hope that someone is expecting a delivery."}, {"anchor": "t2", "label": "Asks for details the real carrier already holds", "evidence": "confirm the recipient's full name, delivery address and a contact phone number", "explanation": "The shipper wrote that information on the label before the parcel entered the network. The 'confirmation' form exists to collect a real name, address and phone number for the attacker, and it will ask for more on the next page."}, {"anchor": "t3", "label": "Return-to-sender countdown with a cost attached", "evidence": "Packages not confirmed within 72 hours are returned to sender and the shipping charge is forfeited.", "explanation": "A short clock plus a threatened loss is pressure engineering. A real carrier that cannot deliver leaves a physical notice and holds the package for several days without demanding anything by email."}, {"anchor": "t4", "label": "Button lands on the lookalike domain", "evidence": "ups-parcel-services.com/track/address-confirm", "explanation": "Hovering shows the same impostor host as the sender, not ups.com. If a delivery genuinely stalls, type the tracking number into the carrier's own site yourself."}], "takeaway": "Hyphenated add-on words are the trick: ups.com is UPS, but ups-parcel-services.com belongs to whoever registered it."}, {"id": "l2-microsoft-legit", "brand": "Microsoft account", "brandKey": "microsoft", "fromName": "Microsoft account team", "fromAddress": "account-security-noreply@accountprotection.microsoft.com", "replyTo": null, "subject": "New sign-in to your Microsoft account", "date": "Aug 28, 9:03 AM", "preview": "We noticed a new sign-in to your Microsoft account from a Windows device in Chicago...", "bodyHtml": "<p>Jordan Rivera,<\/p><p>Your Microsoft account was signed in to from a new device.<\/p><ul><li>Country/region: United States<\/li><li>IP address: 74.12.••.••<\/li><li>Platform: Windows<\/li><li>Browser: Edge<\/li><\/ul><p><span class='tell' data-tell='t1'>If this was you, you don't need to do anything.<\/span> If you don't recognise this activity, <span class='tell' data-tell='t2'>go to your Microsoft account security page and review your recent activity<\/span>.<\/p><p><a class='lnk' data-href='https://account.microsoft.com/security' data-tell='t3'>account.microsoft.com/security<\/a><\/p><p>Thanks,<br>The Microsoft account team<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Genuine Microsoft security domain", "evidence": "account-security-noreply@accountprotection.microsoft.com", "explanation": "accountprotection.microsoft.com is a real Microsoft-owned subdomain — the part before the final .com is microsoft, with no digits or hyphenated add-ons."}, {"anchor": "t1", "label": "No pressure, no deadline", "evidence": "If this was you, you don't need to do anything.", "explanation": "Real alerts are informational. Phishing needs you to act; genuine notices are happy for you to ignore them."}, {"anchor": "t2", "label": "Tells you to navigate yourself", "evidence": "go to your Microsoft account security page and review your recent activity", "explanation": "Directing you to the site rather than demanding a click is the opposite of credential harvesting."}, {"anchor": "t3", "label": "Link matches the visible text and the brand", "evidence": "account.microsoft.com/security", "explanation": "Displayed text and hover destination are identical and sit on microsoft.com. Nothing to reset, nothing to confirm — just a page to look at."}], "takeaway": "An alarming subject on a correct domain, with no deadline and nothing to click, is usually the real thing."}, {"id": "l2-linkedin", "brand": "LinkedIn", "brandKey": "linkedin", "fromName": "LinkedIn", "fromAddress": "messages-noreply@linkedin.com", "replyTo": null, "subject": "Priya Raghavan sent you a message about Finance Operations", "date": "Aug 27, 4:35 PM", "preview": "Priya Raghavan · Talent Partner at Calder Systems — Hi Jordan, we're hiring a Senior Finance Operations Analyst...", "bodyHtml": "<p><strong>Priya Raghavan<\/strong> · Talent Partner at Calder Systems<\/p><p>\"Hi Jordan — we're hiring a Senior Finance Operations Analyst and your background at Northwind Trading stood out. <span class='tell' data-tell='t2'>Would you be open to a short call next week? No CV, documents or account details needed at this stage — just reply here if you're interested.<\/span>\"<\/p><p><a class='btn' data-href='https://www.linkedin.com/messaging/' data-tell='t1'>Reply to Priya<\/a><\/p><p>You are receiving InMail notification emails. Manage your email preferences or unsubscribe.<\/p><p>© 2026 LinkedIn Corporation, 1000 West Maude Avenue, Sunnyvale, CA 94085<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Exact LinkedIn domain, no extras", "evidence": "messages-noreply@linkedin.com", "explanation": "The registered domain is plain linkedin.com — no hyphenated suffix, no swapped characters, nothing appended after the .com. Compare it with the 'linked-in-mail.com' style domains scammers register."}, {"anchor": "t1", "label": "Button opens the messaging inbox, not a sign-in form", "evidence": "https://www.linkedin.com/messaging/", "explanation": "The target is your own message inbox on linkedin.com. There is no credential page anywhere in this flow — and you can skip the button entirely, open the LinkedIn app yourself, and the same message will be waiting there. That check is free and settles it."}, {"anchor": "t2", "label": "Asks for nothing — the only request is a conversation", "evidence": "No CV, documents or account details needed at this stage — just reply here if you're interested.", "explanation": "Nothing here is worth stealing: no login, no file, no payment detail, no personal data, and no deadline. An attacker's whole purpose is to extract something on this click, so a message whose entire ask is 'would you talk to me' has no payload to deliver."}], "takeaway": "Recruiter mail is a favourite disguise, so judge the sender domain and what the message actually wants — the unsubscribe footer proves nothing, since phishing kits clone real templates footer and all."}]}, {"level": 3, "title": "Plausible Pretexts", "intro": "The bait now looks exactly like your Tuesday inbox: a colleague's shared spreadsheet, a quarantine digest, a parcel stuck at customs. The brand name is still sitting in the address — it just isn't the part that's registered.", "debriefPoints": ["The right-to-left rule, one level deeper: everything to the LEFT of those last two labels is a subdomain, and the domain's owner invents as many as he likes for free. In dropbox.com.file-share-secure.net and protection.outlook.com.mail-quarantine-review.net the real owners are file-share-secure.net and mail-quarantine-review.net.", "Nothing may follow the brand's .com. docs.google.com and www.fedex.com are genuine subdomains OF the real domain — brand last. Once extra labels appear after the .com, the familiar name is just decoration in front of someone else's domain.", "No file-share, quarantine portal or mailbox ever needs your work password from an email. The Dropbox lure and the fake Defender digest both demanded it; the real Google share and the real FedEx notice asked for nothing at all.", "Fabricated countdowns: a link that 'expires in 24 hours', quarantine 'permanently deleted after 24 hours' (Microsoft actually holds it about 30 days), a parcel returned in 48 hours. Real systems do not destroy your things overnight.", "Small fees and familiar names are bait. $2.99 is priced to feel too trivial to verify, and a quarantine list naming your vendor, your bank and your manager is guessable — the prize is the card number or the password, not the fee.", "Every legitimate message here could be reached without touching the email: DocuSign's Access Documents security code, 'Shared with me' in your own Drive, the tracking number typed into fedex.com. If you cannot reach the thing independently, do not trust the button."], "emails": [{"id": "l3-dropbox", "brand": "Dropbox", "brandKey": "dropbox", "fromName": "Dropbox", "fromAddress": "no-reply@dropbox.com.file-share-secure.net", "replyTo": null, "subject": "Marcus Webb shared \"Q3_Vendor_Payments_FINAL.xlsx\" with you", "date": "Aug 27, 6:52 PM", "preview": "Marcus Webb shared a folder with you on Dropbox Business. This secure link expires in 24 hours...", "bodyHtml": "<p>Hi Jordan,<\/p><p><strong>Marcus Webb<\/strong> shared a file with you on Dropbox Business.<\/p><p><em>Q3_Vendor_Payments_FINAL.xlsx<\/em> — 412 KB<\/p><p><a class='btn' data-href='https://dropbox.com.file-share-secure.net/business/view?id=8842' data-tell='t1'>View file<\/a><\/p><p><span class='tell' data-tell='t2'>To open this document you will be asked to confirm your Northwind email address and password.<\/span><\/p><p><span class='tell' data-tell='t3'>This secure link expires 24 hours after delivery.<\/span><\/p><p>Direct link: <a class='lnk' data-href='https://dropbox.com.file-share-secure.net/business/view?id=8842' data-tell='t4'>https://www.dropbox.com/scl/fi/q3-vendor-payments<\/a><\/p><p>Happy collaborating,<br>The Dropbox team<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Dropbox is only a subdomain here", "evidence": "dropbox.com.file-share-secure.net", "explanation": "Read it right-to-left: the registered domain is file-share-secure.net, and 'dropbox.com' is just a subdomain label the attacker typed in front of it. Real Dropbox mail ends in @dropbox.com with nothing after it."}, {"anchor": "t1", "label": "Button leads to the attacker's domain", "evidence": "dropbox.com.file-share-secure.net/business/view?id=8842", "explanation": "Hovering shows the same fake host as the sender. A genuine share button lands on dropbox.com or dropboxusercontent.com."}, {"anchor": "t2", "label": "Asks for your work email password", "evidence": "confirm your Northwind email address and password", "explanation": "Dropbox has no reason to want your Microsoft 365 credentials — it can't check them. Any file link that asks for a password belonging to a different service is harvesting logins."}, {"anchor": "t3", "label": "Artificial expiry on a shared file", "evidence": "This secure link expires 24 hours after delivery", "explanation": "Share links from colleagues don't self-destruct overnight. The countdown exists to stop you walking over to Marcus's desk and asking."}, {"anchor": "t4", "label": "Link text lies about the destination", "evidence": "https://www.dropbox.com/scl/fi/q3-vendor-payments", "explanation": "The visible text is a perfectly real Dropbox URL, but the underlying data-href goes somewhere else entirely. Visible link text is decoration; only the hover target is real."}], "takeaway": "A trusted brand sitting to the LEFT of the last dot is decoration — the owner of the address is always the last two labels before the first slash."}, {"id": "l3-microsoft", "brand": "Microsoft 365", "brandKey": "microsoft", "fromName": "Microsoft 365 Defender", "fromAddress": "no-reply@protection.outlook.com.mail-quarantine-review.net", "replyTo": null, "subject": "3 messages were quarantined as spam - review and release", "date": "Aug 28, 7:12 AM", "preview": "Microsoft Defender for Office 365 placed 3 messages addressed to you in quarantine between 27 and 28 August...", "bodyHtml": "<p>Hi Jordan,<\/p><p>Microsoft Defender for Office 365 placed <strong>3 messages<\/strong> addressed to j.rivera@northwind-trading.com in quarantine between 27 and 28 August. They were classified as spam and are held pending your review.<\/p><ul><li><span class='tell' data-tell='t1'>Bishop &amp; Vane Supplies — Remittance advice PO-44120<\/span><\/li><li>Meridian Bank — Your August statement is ready<\/li><li>Marcus Webb — Fwd: Q3 close checklist<\/li><\/ul><p><a class='btn' data-href='https://protection.outlook.com.mail-quarantine-review.net/quarantine/review?id=NW8842' data-tell='t2'>Review quarantined messages<\/a><\/p><p><span class='tell' data-tell='t3'>Sign in with your Northwind email password to release any message you want delivered.<\/span><\/p><p><span class='tell' data-tell='t4'>Items left in quarantine are permanently deleted after 24 hours and cannot be recovered.<\/span><\/p><p>Microsoft Defender for Office 365 — Quarantine digest<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "protection.outlook.com is only a subdomain label here", "evidence": "protection.outlook.com.mail-quarantine-review.net", "explanation": "Read it right-to-left: the registered owner is mail-quarantine-review.net, and Microsoft's real filtering host has simply been typed in front of it as a subdomain. Genuine Defender digests end at outlook.com or microsoft.com with nothing appended after."}, {"anchor": "t2", "label": "Review button lands on the attacker's registered domain", "evidence": "protection.outlook.com.mail-quarantine-review.net/quarantine/review", "explanation": "Microsoft sign-in happens on Microsoft-owned hosts such as login.microsoftonline.com or login.microsoft.com — the registrable domain always ends at microsoft.com or microsoftonline.com with nothing appended after it. Here extra labels follow the .com, so the page belongs to whoever bought mail-quarantine-review.net."}, {"anchor": "t3", "label": "Asks you to type your work password", "evidence": "Sign in with your Northwind email password to release any message", "explanation": "A real quarantine portal opens inside the Microsoft 365 session you already hold; releasing a message never requires you to re-key your password from an email. Any prompt for it is credential harvesting."}, {"anchor": "t4", "label": "Fabricated 24-hour deletion window", "evidence": "permanently deleted after 24 hours and cannot be recovered", "explanation": "Microsoft holds quarantined mail for roughly 30 days by default, and nothing vanishes overnight. The countdown exists so you click before checking with the helpdesk."}, {"anchor": "t1", "label": "Quarantine list seeded with senders you actually deal with", "evidence": "Bishop & Vane Supplies", "explanation": "Naming a real vendor, your bank and your manager makes the digest feel authentic and makes you fear you have missed something important. Sender names are trivial to guess or scrape — they are bait, not proof."}], "takeaway": "Quarantine digests are easy to fake — open the release page from your own Outlook or the Microsoft 365 portal you navigate to yourself, never from the emailed button."}, {"id": "l3-dhl", "brand": "DHL Express", "brandKey": "dhl", "fromName": "DHL Express", "fromAddress": "notice@dhl.com.parcel-redelivery-track.net", "replyTo": null, "subject": "Delivery attempt failed - customs charge of $2.99 outstanding", "date": "Aug 28, 5:26 AM", "preview": "Waybill 4423 8871 09 could not be delivered because import duties remain unpaid...", "bodyHtml": "<p><span class='tell' data-tell='t1'>Dear Customer,<\/span><\/p><p>Our courier attempted to deliver your parcel (waybill 4423 8871 09) on 27 August, but delivery could not be completed because <strong>import duties remain unpaid<\/strong>.<\/p><p><span class='tell' data-tell='t2'>An outstanding customs charge of $2.99 must be settled by card before delivery can be rescheduled.<\/span><\/p><p><a class='btn' data-href='https://dhl.com.parcel-redelivery-track.net/pay/4423887109' data-tell='t3'>Pay Fee and Reschedule Delivery<\/a><\/p><p><span class='tell' data-tell='t4'>Parcels not claimed within 48 hours are returned to the sender and shipping costs are forfeited.<\/span><\/p><p>DHL Express Customer Service<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "dhl.com is only the first label", "evidence": "dhl.com.parcel-redelivery-track.net", "explanation": "The registered domain is parcel-redelivery-track.net. Attackers buy a plausible logistics domain and then prepend the carrier's real name as a subdomain."}, {"anchor": "t1", "label": "Generic greeting on a named shipment", "evidence": "Dear Customer", "explanation": "A carrier that genuinely holds a parcel for you knows the recipient name and delivery address printed on the label."}, {"anchor": "t2", "label": "Tiny fee, card details required", "evidence": "customs charge of $2.99 must be settled by card", "explanation": "The amount is deliberately trivial so you pay rather than investigate. The target is your full card number, expiry and CVV — not the three euros."}, {"anchor": "t3", "label": "Payment page on the impostor domain", "evidence": "dhl.com.parcel-redelivery-track.net/pay/4423887109", "explanation": "Real duty payments are made through dhl.com after logging into the carrier's own portal, reached by typing the address yourself."}, {"anchor": "t4", "label": "48-hour forfeiture threat", "evidence": "returned to the sender and shipping costs are forfeited", "explanation": "Loss-framing plus a countdown is the standard pressure pattern. Carriers hold parcels for days and leave a physical card, not an emailed ultimatum."}], "takeaway": "If a delivery notice asks for money, look up the tracking number yourself on the carrier's real site — never through the link in the message."}, {"id": "l3-docusign", "brand": "DocuSign", "brandKey": "docusign", "fromName": "Bishop & Vane Supplies via DocuSign", "fromAddress": "dse_NA3@docusign.net", "replyTo": "accounts@bishopvane.com", "subject": "Please DocuSign: Bishop & Vane Supplies - Q4 Supply Agreement", "date": "Aug 28, 10:18 AM", "preview": "Alex Bishop sent you a document to review and sign. Security code: 4C9A21DE77...", "bodyHtml": "<p>Alex Bishop sent you a document to review and sign.<\/p><p><strong>Q4 Supply Agreement — Northwind Trading Co.<\/strong><\/p><p>Jordan — this is the renewal we talked through on Tuesday. Pricing schedule is unchanged from Q3; signature needed on page 4 only.<\/p><p><a class='btn' data-href='https://na3.docusign.net/Signing/EmailStart.aspx?a=8f2c1b' data-tell='t1'>Review Document<\/a><\/p><p><span class='tell' data-tell='t2'>Alternate signing method: go to docusign.com, choose Access Documents, and enter security code 4C9A21DE77.<\/span><\/p><p>This link is unique to you — please do not forward this email. Questions about the contents of the document should go to the sender directly.<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "docusign.net is DocuSign's real sending domain", "evidence": "dse_NA3@docusign.net", "explanation": "DocuSign envelopes genuinely come from docusign.net (dse_ prefixes are its mail relays), and the domain ends there — nothing is appended after it."}, {"anchor": "replyto", "label": "Reply-to points at the real vendor, which is normal here", "evidence": "accounts@bishopvane.com", "explanation": "DocuSign deliberately sets reply-to to the company that sent the envelope, so a reply reaches Bishop & Vane. A reply-to that differs from the from-line is only suspicious when it points somewhere unrelated to either party."}, {"anchor": "t1", "label": "Signing link stays on docusign.net", "evidence": "na3.docusign.net/Signing/EmailStart.aspx", "explanation": "na3 is a regional DocuSign server, a subdomain OF docusign.net — the trusted name is the registered domain here, not a label in front of someone else's."}, {"anchor": "t2", "label": "Security code lets you bypass the link entirely", "evidence": "go to docusign.com, choose Access Documents, and enter security code 4C9A21DE77", "explanation": "This is a genuine DocuSign feature and the safest way to open any envelope: type docusign.com yourself and enter the code. Phishing copies rarely offer a route that doesn't use their link."}], "takeaway": "Real DocuSign lives at docusign.net/docusign.com and hands you a security code so you never have to trust the emailed button."}, {"id": "l3-fedex", "brand": "FedEx", "brandKey": "fedex", "fromName": "FedEx", "fromAddress": "TrackingUpdates@fedex.com", "replyTo": null, "subject": "Delivery exception: shipment 7742 1188 3096 to Northwind Trading Co.", "date": "Aug 28, 12:04 PM", "preview": "Hello JORDAN RIVERA, we attempted delivery of your shipment on Aug 28 at 11:42 AM, but the receiving dock was closed...", "bodyHtml": "<p>Hello JORDAN RIVERA,<\/p><p>We attempted delivery of your shipment on Aug 28 at 11:42 AM, but the receiving dock was closed.<\/p><p><span class='tell' data-tell='t1'>No action is required — we will automatically attempt delivery again on the next business day (Monday 31 August).<\/span><\/p><p>Tracking number: 7742 1188 3096<br><span class='tell' data-tell='t2'>Shipper: Bishop &amp; Vane Supplies — Reference: PO-44120<\/span><\/p><p><a class='btn' data-href='https://www.fedex.com/fedextrack/?trknbr=774211883096' data-tell='t3'>Track this shipment<\/a><\/p><p>FedEx Customer Support<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "fedex.com is the registered domain", "evidence": "TrackingUpdates@fedex.com", "explanation": "The address ends at fedex.com with nothing appended — compare it against the DHL message in this level, where the carrier's name sat in front of somebody else's domain."}, {"anchor": "t1", "label": "Nothing is demanded of you", "evidence": "No action is required", "explanation": "An exception notice that resolves itself is the opposite of the phishing pattern, and the retry date is stated plainly rather than left as a countdown. Fraudulent delivery mail always needs a fee, a form or a login within hours."}, {"anchor": "t2", "label": "Details match a shipment you're expecting", "evidence": "Shipper: Bishop & Vane Supplies — Reference: PO-44120", "explanation": "A real carrier notice carries the shipper name and your own purchase-order reference, which you can check against your records before clicking anything."}, {"anchor": "t3", "label": "Tracking link resolves to www.fedex.com", "evidence": "https://www.fedex.com/fedextrack/?trknbr=774211883096", "explanation": "Hovering shows the host is www.fedex.com and the tracking number is only a query parameter. You could also paste that number into fedex.com yourself and get the same page."}], "takeaway": "A delivery problem is not automatically a scam — a real one names your shipment, asks for no money, and links to the carrier's own domain."}, {"id": "l3-google", "brand": "Google Docs", "brandKey": "google", "fromName": "Marcus Webb (via Google Sheets)", "fromAddress": "drive-shares-dm-noreply@google.com", "replyTo": "m.webb@northwind-trading.com", "subject": "Marcus Webb shared a document: FY26 Budget Variance - Ops", "date": "Aug 28, 4:15 PM", "preview": "Marcus Webb has invited you to edit the following document: FY26 Budget Variance - Ops...", "bodyHtml": "<p><strong>Marcus Webb<\/strong> has invited you to <em>edit<\/em> the following document:<\/p><p><strong><a class='lnk' data-href='https://docs.google.com/spreadsheets/d/1kQ9fVarianceOps26/edit' data-tell='t1'>FY26 Budget Variance — Ops<\/a><\/strong><\/p><p>Jordan — variance notes ahead of next Thursday's review. Leave comments in the margin, no need to reply by mail.<\/p><p><a class='btn' data-href='https://docs.google.com/spreadsheets/d/1kQ9fVarianceOps26/edit' data-tell='t2'>Open in Google Sheets<\/a><\/p><p>The file also appears in your Drive under <em>Shared with me<\/em>.<\/p><p>Google LLC, 1600 Amphitheatre Parkway, Mountain View, CA 94043<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Google's genuine share-notification address", "evidence": "drive-shares-dm-noreply@google.com", "explanation": "Drive shares are sent by a no-reply robot at google.com. The display name shows the colleague, but the sending domain is Google's own and ends there — nothing is appended after the .com."}, {"anchor": "replyto", "label": "Reply-to is the real colleague on the real internal domain", "evidence": "m.webb@northwind-trading.com", "explanation": "Google routes replies back to the person who shared the file. The spelling of northwind-trading.com is exact — worth checking character by character every time."}, {"anchor": "t1", "label": "Document link stays on docs.google.com", "evidence": "https://docs.google.com/spreadsheets/d/1kQ9fVarianceOps26/edit", "explanation": "docs.google.com is a subdomain of google.com, the registered domain. That is the legitimate shape — brand last, not brand first, unlike dropbox.com.file-share-secure.net elsewhere in this level."}, {"anchor": "t2", "label": "The button only opens the file — nothing here asks for a password", "evidence": "Open in Google Sheets", "explanation": "Read the whole message and notice what is missing: no credential request anywhere. A real share simply opens in the browser session you are already using, or from Shared with me in your own Drive. The Dropbox lure in this level demanded your Northwind email password before it would show the file — that difference is the whole lesson."}], "takeaway": "Compare this with the Dropbox lure: same 'a colleague shared a file' story, but here the domain is google.com and nothing in the message ever asks for a password."}]}, {"level": 4, "title": "Near-Perfect Forgeries", "intro": "Everything here is pixel-perfect: correct logos, flawless grammar, real finance context, no shouting. What's left are single-character domain forgeries, header mismatches, and reassurance the sender simply typed himself.", "debriefPoints": ["Homograph domains: the 'a' in meridiаnbank.com and аpple.com is Cyrillic U+0430, pixel-identical to Latin 'a', and it disguised the links as well as the sender. You cannot see it by eye — open “details → check the characters” on any message and the lab names every non-Latin character and the punycode (xn--) form the domain really registers as. In real life you copy the suspect address into a plain-text editor or notes app. Never open the page to find out.", "The 'rn' trick: rnicrosoft.com reads as microsoft.com at a glance and in small type. Read the domain character by character, right to left from the TLD.", "Reply-To is a separate header from From, and a mismatch is not automatically bad — what matters is where it points. Concur's pointed at t.okafor@northwind-trading.com, a named colleague on your own exact domain; the bank forgery's pointed at meridianbank-treasury.com, a third domain entirely.", "Security reassurance inside a message proves nothing. '256-bit SSL', 'SPF, DKIM and DMARC all passed', 'delivered over TLS 1.3 and digitally signed by Apple' are sentences any sender can type — genuine authentication results are computed by your mail server, which is why real senders never advertise them.", "Never dial a number an email supplies. The Apple and Meridian numbers reach the attacker, who talks you through 'cancelling' the charge and then asks for a one-time token code or remote access — a code read aloud is a sign-in as you. Use the number on your card, your statement or your own vendor record.", "Fall back on what only you know: you never bought Final Cut Pro, the Concur report matches a trip you can verify, and Google's notice actively told you to check with your own IT. Perfect design cannot fake your history — and note that the legitimate mail here carried no deadline and asked for no password."], "emails": [{"id": "l4-microsoft", "brand": "Microsoft 365", "brandKey": "microsoft", "fromName": "Microsoft 365 Message Center", "fromAddress": "no-reply@rnicrosoft.com", "replyTo": "m365-support@secure-mailflow.net", "subject": "Action required: re-register Microsoft Authenticator before Aug 31", "date": "Aug 28, 8:02 AM", "preview": "Your organisation has updated its conditional access policy. Devices enrolled before June 2026 must...", "bodyHtml": "<p>Hello Jordan,<\/p><p>Northwind Trading Co. has updated its conditional access policy. Accounts whose authenticator was registered before June 2026 must re-register to keep uninterrupted access to Outlook, SharePoint and Teams.<\/p><p>Re-registration takes about two minutes and <span class='tell' data-tell='t1'>requires your current password to confirm your identity<\/span>.<\/p><p><a class='btn' data-href='https://login.rnicrosoft.com/common/oauth2/reauthorize' data-tell='t2'>Re-register Microsoft Authenticator<\/a><\/p><p><span class='tell' data-tell='t3'>This message is secured with 256-bit SSL. Look for the padlock in your browser before signing in.<\/span><\/p><p>Microsoft 365 Identity Team<br><a class='lnk' data-href='https://rnicrosoft.com/privacy' data-tell='t4'>microsoft.com/privacy<\/a><\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "'rn' is impersonating 'm'", "evidence": "no-reply@rnicrosoft.com", "explanation": "The domain is r-n-i-c-r-o-s-o-f-t.com, not microsoft.com. At normal font sizes 'rn' is visually indistinguishable from 'm', so read a domain letter by letter when anything is being asked of you."}, {"anchor": "replyto", "label": "Reply-To goes somewhere else entirely", "evidence": "m365-support@secure-mailflow.net", "explanation": "The From and Reply-To headers are independent. Even if the From line had been perfect, any reply here would land at secure-mailflow.net, an address with no relationship to Microsoft."}, {"anchor": "t1", "label": "Asks for your current password", "evidence": "requires your current password to confirm your identity", "explanation": "Re-enrolling an authenticator happens inside a session you already started yourself. A notification email that needs your password is harvesting it."}, {"anchor": "t2", "label": "Sign-in button uses the fake domain", "evidence": "https://login.rnicrosoft.com/common/oauth2/reauthorize", "explanation": "The path copies Microsoft's real OAuth structure to look authentic, but the host is the counterfeit rnicrosoft.com. Genuine sign-in is always login.microsoftonline.com."}, {"anchor": "t3", "label": "Fake security reassurance", "evidence": "This message is secured with 256-bit SSL", "explanation": "SSL protects data in transit; it says nothing about who sent the mail. Attackers add padlock language precisely because it makes readers relax."}, {"anchor": "t4", "label": "Footer link text lies about its destination", "evidence": "microsoft.com/privacy", "explanation": "The visible text reads microsoft.com but the link resolves to rnicrosoft.com/privacy. Even boilerplate footer links are worth hovering."}], "takeaway": "Read domains character by character — 'rn' can pose as 'm' — and remember Reply-To can point anywhere the sender likes."}, {"id": "l4-meridianbank", "brand": "Meridian Bank", "brandKey": "meridianbank", "fromName": "Meridian Bank Treasury Services", "fromAddress": "treasury.alerts@meridiаnbank.com", "replyTo": "positivepay.review@meridianbank-treasury.com", "subject": "Positive Pay: 2 exception items require a decision by 11:00 ET", "date": "Aug 28, 7:48 AM", "preview": "Good morning Jordan, two items presented against operating account ending 4416 did not match your issued-check file...", "bodyHtml": "<p>Good morning Jordan,<\/p><p>Two items presented against Northwind Trading Co. operating account ending 4416 did not match your issued-check file and are being held as Positive Pay exceptions:<\/p><ul><li>Check 10428 — $8,940.00 — Bishop &amp; Vane Supplies — amount mismatch<\/li><li>Check 10431 — $2,215.60 — payee mismatch<\/li><\/ul><p>Please pay or return each item before this morning's 11:00 ET cut-off.<\/p><p><span class='tell' data-tell='t1'>This notification is verified: SPF, DKIM and DMARC all passed.<\/span><\/p><p><a class='btn' data-href='https://meridiаnbank.com/treasury/exceptions/decision'>Review exceptions in Treasury Gateway<\/a><\/p><p><span class='tell' data-tell='t2'>If you cannot sign in, call the Treasury Desk on +1 (203) 555-0148 with your token code ready and we will action the items for you.<\/span><\/p><p>Meridian Bank, N.A. — Treasury Services, Stamford CT · <a class='lnk' data-href='https://meridiаnbank.com/treasury' data-tell='t3'>meridianbank.com<\/a><\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Cyrillic look-alike in the domain", "evidence": "treasury.alerts@meridiаnbank.com", "explanation": "The 'a' in 'meridian' is Cyrillic 'а' (U+0430), not Latin 'a'. It renders identically but registers as a completely different domain. Paste suspect addresses into a plain-text editor to expose them."}, {"anchor": "replyto", "label": "Reply-To is a third, unrelated domain", "evidence": "positivepay.review@meridianbank-treasury.com", "explanation": "A real bank replies from its own domain. Here the hyphenated meridianbank-treasury.com is attacker-controlled and would collect anything you send back, including account details."}, {"anchor": "t1", "label": "Self-declared authentication results", "evidence": "SPF, DKIM and DMARC all passed", "explanation": "Authentication results are computed by your mail server, not written by the sender. Any sender can type this sentence, which is why real banks never do."}, {"anchor": "t2", "label": "Callback number plus token code request", "evidence": "call the Treasury Desk on +1 (203) 555-0148 with your token code ready", "explanation": "The number is supplied by the attacker, and a one-time token code read aloud lets them sign in as you. Only call the number printed on your statement or in your treasury vendor record."}, {"anchor": "t3", "label": "Footer link text is all-Latin, the destination is not", "evidence": "meridianbank.com", "explanation": "The visible footer text is the genuine Latin meridianbank.com, but the hover target is the Cyrillic forgery used everywhere else in this message — and the two look identical on screen. Displayed text is decoration; only the destination counts, and here even that is disguised, so type the bank's address yourself."}], "takeaway": "One Cyrillic character can clone a bank's domain and its links — verify money decisions in the portal you navigate to yourself, and confirm a same-day cut-off by calling the number on your statement."}, {"id": "l4-apple", "brand": "Apple", "brandKey": "apple", "fromName": "Apple", "fromAddress": "no_reply@invoice.аpple.com", "replyTo": null, "subject": "Your receipt from Apple", "date": "Aug 28, 11:26 PM", "preview": "Your receipt from Apple — Order ID MLQ7K2P4X9 — Final Cut Pro — $324.74 billed to Visa ending 6042", "bodyHtml": "<p><strong>Your receipt from Apple<\/strong><\/p><p>Apple ID: j.rivera@northwind-trading.com<br>Order ID: MLQ7K2P4X9<br>Date: 28 Aug 2026<\/p><ul><li>Final Cut Pro — one-time purchase — $299.99<\/li><li>Subtotal $299.99 · Tax $24.75 · <strong>Total $324.74<\/strong><\/li><\/ul><p>Billed to Visa ending 6042. <span class='tell' data-tell='t1'>If you did not authorise this purchase, you must cancel it within 48 hours.<\/span><\/p><p><a class='btn' data-href='https://аpple.com/receipts/dispute' data-tell='t2'>Report a Problem<\/a><\/p><p><span class='tell' data-tell='t3'>This receipt was delivered over TLS 1.3 and is digitally signed by Apple.<\/span><\/p><p>Need help sooner? Call Apple Billing Support on <span class='tell' data-tell='t4'>+1 (888) 555-0172<\/span>.<\/p>", "verdict": "phishing", "tells": [{"anchor": "from", "label": "Cyrillic 'а' in apple.com", "evidence": "no_reply@invoice.аpple.com", "explanation": "The first letter of 'apple' is Cyrillic 'а' (U+0430), not Latin 'a'. It renders identically, but the registrable domain belongs to whoever bought the lookalike. Paste any address you are about to trust into a plain-text editor to expose it."}, {"anchor": "t1", "label": "48-hour cancellation window on a receipt", "evidence": "you must cancel it within 48 hours", "explanation": "A receipt records something that already happened; it has no deadline. The clock exists so you click before checking your real purchase history."}, {"anchor": "t2", "label": "Dispute button goes to the counterfeit domain", "evidence": "https://аpple.com/receipts/dispute", "explanation": "The hover target carries the same Cyrillic 'а' as the sender, so it looks perfect. Apple billing disputes live at reportaproblem.apple.com, reached by typing it yourself."}, {"anchor": "t3", "label": "Encryption claim used as proof of identity", "evidence": "delivered over TLS 1.3 and is digitally signed by Apple", "explanation": "Transport encryption and signing claims typed into a message body are unverifiable text that any sender can write. Genuine Apple receipts never advertise their own cryptography."}, {"anchor": "t4", "label": "Support number planted in the email", "evidence": "+1 (888) 555-0172", "explanation": "The number routes to the attacker, who will walk you through 'refunding' the charge and capture your card or remote access. Find support numbers on the vendor's own site or the back of your card."}], "takeaway": "An unexpected charge is bait — never use the phone number or dispute link inside the message; reach the vendor through an address you typed yourself."}, {"id": "l4-google", "brand": "Google Workspace", "brandKey": "google", "fromName": "Google Workspace", "fromAddress": "googleworkspace-noreply@google.com", "replyTo": null, "subject": "Reconnect SheetSync for Excel before 11 September", "date": "Aug 27, 1:14 PM", "preview": "We're writing about a change to how third-party apps connect to Google Workspace at Northwind...", "bodyHtml": "<p>Hello Jordan,<\/p><p>We're writing about a change to how third-party apps connect to Google Workspace at Northwind Trading Co.<\/p><p>From <span class='tell' data-tell='t1'>11 September 2026<\/span>, apps that sign in with only a username and password will no longer be able to reach Gmail, Drive or Calendar. Affected apps have to be reconnected using Sign in with Google.<\/p><p>One app on your account still uses the older method: <strong>SheetSync for Excel<\/strong>.<\/p><p>Nothing needs doing from this message. <span class='tell' data-tell='t2'>If you're unsure whether you still use this app, check with your Northwind IT administrator before the change date.<\/span><\/p><p>What's changing, and how to reconnect: <a class='lnk' data-href='https://support.google.com/a/answer/7281227' data-tell='t3'>support.google.com/a<\/a><\/p><p>You received this mandatory service announcement about your Google Workspace account.<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Google's real Workspace notification address", "evidence": "googleworkspace-noreply@google.com", "explanation": "Read the last two labels before the @-sign's domain ends: google.com, every character Latin, with nothing appended after it. Compare that shape with google.com.workspace-notice.net or g00gle.com, where the familiar word is decoration in front of somebody else's registered domain."}, {"anchor": "t1", "label": "A scheduled date, not a countdown", "evidence": "11 September 2026", "explanation": "The deadline is a published product change more than two weeks out, and missing it breaks one spreadsheet add-on — not your account. Phishing deadlines are hours long and always threaten loss of access, money or the mailbox itself."}, {"anchor": "t2", "label": "Actively points you at your own IT team", "evidence": "check with your Northwind IT administrator", "explanation": "A genuine notice is happy for you to verify it with someone else. Look at the fakes that tell you the opposite — 'do not forward this to your IT department' — because a second pair of eyes is exactly what an attacker cannot survive."}, {"anchor": "t3", "label": "Link goes to Google's help centre, not a sign-in form", "evidence": "https://support.google.com/a/answer/7281227", "explanation": "support.google.com is a subdomain of google.com, and the page it opens explains the change rather than asking you to authenticate. The email hands you information; it never asks for a password, a code or a card."}], "takeaway": "A deadline and an app about to stop working is not automatically an attack — this one is on Google's own domain, sends you to a help article, and invites you to check with IT."}, {"id": "l4-docusign", "brand": "SAP Concur", "brandKey": "generic", "fromName": "SAP Concur", "fromAddress": "automated-notification@concursolutions.com", "replyTo": "t.okafor@northwind-trading.com", "subject": "Expense report awaiting your approval: Tomas Okafor - Cleveland client visit", "date": "Aug 28, 9:41 AM", "preview": "Hello Jordan, Tomas Okafor submitted an expense report that is waiting for your approval as delegate approver...", "bodyHtml": "<p>Hello Jordan,<\/p><p><strong>Tomas Okafor<\/strong> submitted an expense report that is waiting for your approval as delegate approver.<\/p><ul><li>Report: Client visit - Cleveland, Aug 18-20<\/li><li>Total: $1,142.63<\/li><li>Policy exceptions: 0<\/li><\/ul><p>You can approve it or send it back for revision in Concur. Questions about individual line items should go to the submitter - replies to this notification reach Tomas directly.<\/p><p><a class='btn' data-href='https://www.concursolutions.com/approvals/report/8841772' data-tell='t1'>Review in Concur<\/a><\/p><p><span class='tell' data-tell='t2'>No password is requested in this message; you will sign in with your usual Northwind single sign-on.<\/span><\/p><p>SAP Concur, 601 108th Ave NE, Bellevue, WA 98004<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Concur's real sending domain, ending where it should", "evidence": "automated-notification@concursolutions.com", "explanation": "concursolutions.com is the registered domain and the address stops there - no extra label appended after the .com, no digit or 'rn' substitution. Read it right-to-left the same way you read rnicrosoft.com in this level, and it survives the check."}, {"anchor": "replyto", "label": "Reply-To differs from From, but points at your own colleague", "evidence": "t.okafor@northwind-trading.com", "explanation": "Bulk notification platforms send from a no-reply robot and set Reply-To to the human who triggered the message, so your reply reaches Tomas rather than a mail server. A differing Reply-To is only suspicious when it points somewhere unrelated to either party - here it is your own company's exact domain, northwind-trading.com, spelled character for character."}, {"anchor": "t1", "label": "Approval link stays on the registered domain", "evidence": "https://www.concursolutions.com/approvals/report/8841772", "explanation": "The host is www.concursolutions.com, a subdomain OF the real domain - brand last, not brand pasted in front of somebody else's name. You could also reach the same queue by opening Concur from your own bookmark."}, {"anchor": "t2", "label": "Nothing is harvested and nothing expires", "evidence": "No password is requested in this message", "explanation": "It asks for a routine business decision on a report you can verify against a trip you already know about, with no deadline and no credentials. Compare the Microsoft forgery in this level, which needed your current password to proceed."}], "takeaway": "A Reply-To that differs from the From line is normal for automated systems - what matters is where it points, and here it points at a named colleague on your own exact domain."}, {"id": "l4-adobe", "brand": "Adobe", "brandKey": "adobe", "fromName": "Adobe", "fromAddress": "mail@mail.adobe.com", "replyTo": null, "subject": "Your Acrobat Pro for teams plan renews on Sep 12, 2026", "date": "Aug 27, 10:05 AM", "preview": "Your annual subscription for 12 licences renews next month. No action is needed to continue.", "bodyHtml": "<p>Hi Jordan,<\/p><p>Your <strong>Acrobat Pro for teams<\/strong> subscription (12 licences) renews on 12 September 2026 at $179.88 per licence per year, billed annually to the card already on file.<\/p><p><span class='tell' data-tell='t1'>No action is needed if you want to continue.<\/span> You can change licence counts or cancel any time before the renewal date in the Admin Console.<\/p><p><a class='btn' data-href='https://account.adobe.com/plans' data-tell='t2'>Manage your plan<\/a><\/p><p>Your invoice will appear under Billing History after the renewal date. <span class='tell' data-tell='t3'>Adobe never requests payment or card details by email.<\/span><\/p><p>Adobe Inc., 345 Park Avenue, San Jose, CA 95110<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Bulk-mail subdomain under the real domain", "evidence": "mail@mail.adobe.com", "explanation": "Read the last two labels: adobe.com. A subdomain like mail.adobe.com is controlled by Adobe, unlike a lookalike such as adobe-mail.com where the real domain is something else entirely."}, {"anchor": "t1", "label": "No deadline, no pressure", "evidence": "No action is needed if you want to continue.", "explanation": "A genuine renewal notice exists to inform you before a charge. Phishing invoices do the opposite: they demand you act now to stop a payment."}, {"anchor": "t2", "label": "Button lands on Adobe's account console", "evidence": "https://account.adobe.com/plans", "explanation": "account.adobe.com is Adobe's real self-service portal, and it manages the plan rather than collecting a card number on a form embedded in a link."}, {"anchor": "t3", "label": "Payment stays on file, not requested", "evidence": "Adobe never requests payment or card details by email.", "explanation": "For an existing subscription the card is already stored, so no legitimate renewal notice needs new payment details. Any 'update your card to avoid cancellation' email is the fake version of this one."}], "takeaway": "Judge a renewal notice by its registrable domain and by what it asks for — a real one informs you; a fake one wants your card."}]}, {"level": 5, "title": "Spear-phishing & BEC", "intro": "The attackers have done their homework: they kno ple Team", "brandKey": "hr-internal", "fromName": "Northwind People Team", "fromAddress": "people@northwind-trading.com", "replyTo": null, "subject": "Annual payroll details check - due 11 September", "date": "Aug 26, 9:03 AM", "preview": "Time for the annual payroll details check - confirm your bank and address details are current...", "bodyHtml": "<p>Hi Jordan,<\/p><p>It's time for the annual payroll details check. Please confirm your bank and address details are current before <span class='tell' data-tell='t1'>Friday 11 September<\/span>.<\/p><p><span class='tell' data-tell='t2'>Sign in through your usual SSO tile - we will never email you a form, send you a link that asks for your password, or ask you to send bank details in a reply.<\/span><\/p><p><a class='btn' data-href='https://people.northwind-trading.com/payroll-check' data-tell='t3'>Open the People Portal<\/a><\/p><p>Questions? Raise a ticket with the helpdesk (helpdesk@northwind-trading.com) or reply here.<\/p><p>Northwind People Team<\/p>", "verdict": "legit", "tells": [{"anchor": "from", "label": "Correct internal HR address", "evidence": "people@northwind-trading.com", "explanation": "The known People Team mailbox on the exact company domain, with no Reply-To redirect. The subject matter is alarming - bank details - but the sender checks out."}, {"anchor": "t1", "label": "A calm, realistic deadline", "evidence": "Friday 11 September", "explanation": "Over two weeks, on a named date, with no threat attached. Real administrative deadlines give you time; phishing deadlines are measured in hours."}, {"anchor": "t2", "label": "Tells you what it will never do", "evidence": "we will never email you a form, send you a link that asks for your password, or ask you to send bank details in a reply", "explanation": "Nothing sensitive is requested in the message itself - it points you at a system you already log into. That is what a real bank-details process looks like."}, {"anchor": "t3", "label": "Button stays on
