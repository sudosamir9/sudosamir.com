/* Brand accent colours. Used for the monogram tile and the in-email
   button/link colour, so each message reads like the brand it claims. */
const BRAND = {
  paypal:'#0070BA', microsoft:'#0067B8', google:'#1A73E8', apple:'#3C3C3C',
  amazon:'#FF9900', dhl:'#D40511', fedex:'#4D148C', ups:'#6B4A17',
  netflix:'#E50914', docusign:'#3B6BB0', dropbox:'#0061FF', linkedin:'#0A66C2',
  adobe:'#EB1000', meta:'#0866FF', instagram:'#C13584', slack:'#4A154B',
  zoom:'#2D8CFF', github:'#24292F', coinbase:'#0052FF', meridianbank:'#116149',
  'it-helpdesk':'#3D5A80', 'hr-internal':'#6A4C93', 'exec-internal':'#2A4D69',
  vendor:'#8A6D3B', generic:'#4A5568'
};
const brandColor = k => BRAND[k] || BRAND.generic;

/* ============================================================
   State
   ============================================================ */
const S = { view:'start', li:0, openId:null, answers:{}, details:{}, inspect:{} };
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvl = () => LEVELS[S.li];
const emails = () => (lvl() && lvl().emails) || [];
const answeredIn = i => (LEVELS[i]?LEVELS[i].emails:[]).filter(e => S.answers[e.id]).length;
const levelDone = i => LEVELS[i] && answeredIn(i) === LEVELS[i].emails.length;

/* ============================================================
   Chrome
   ============================================================ */
function railHtml(){
  const tabs = LEVELS.map((L,i) => `
    <button class="tab" data-goto="${i}" aria-current="${S.view!=='start'&&i===S.li}"
            title="Level ${L.level} — ${esc(L.title)}">${L.level}${levelDone(i)?' <span class="done">&check;</span>':''}</button>`).join('');
  const n = emails().length, a = answeredIn(S.li);
  const prog = S.view==='start' ? '' : `
    <div class="counter">${a} of ${n} triaged</div>
    <div class="pips">${emails().map(e=>`<div class="pip${S.answers[e.id]?' on':''}"></div>`).join('')}</div>`;
  return `<header class="rail">
    <button class="mark" data-home title="Back to the briefing">
      <span class="dot"></span><span class="wm">PHISH<span>LAB</span></span>
    </button>
    <span class="sim">TRAINING SIMULATOR</span>
    <div class="spacer"></div>
    ${prog}
    <div class="tabs">${tabs}</div>
    <button class="ghost" data-reset>Start over</button>
  </header>`;
}

/* ============================================================
   Start screen
   ============================================================ */
function renderStart(){
  const cards = LEVELS.map((L,i) => `
    <button class="lcard" data-goto="${i}">
      <div class="lv"><span>LEVEL ${L.level}</span>${levelDone(i)?'<span class="tick">&check; done</span>':`<span>${L.emails.length} emails</span>`}</div>
      <h4>${esc(L.title)}</h4>
      <p>${esc(L.intro)}</p>
      <div class="bars">${[0,1,2,3,4].map(k=>`<i class="${k<=i?'f':''}"></i>`).join('')}</div>
    </button>`).join('');

  app.innerHTML = railHtml() + `
  <div class="start">
    <div class="eyebrow"><span class="mlabel">Phishing awareness lab</span><span class="rule"></span><span class="mlabel">5 levels &middot; easy &rarr; expert</span></div>
    <h1>Every phish leaves a <em>trace</em>. Find it.</h1>
    <p class="lede">You are <strong>Jordan Rivera</strong>, Finance Operations at Northwind Trading Co. Your inbox holds real mail and fake mail, mixed together. Call each one, then see exactly what gave it away &mdash; or why it was genuine after all.</p>

    <div class="exhibit">
      <div class="ex-l">A reveal, marked up</div>
      <div class="ex-row">From: <b>PayPal Service</b> &lt;<span class="mk flagged" data-n="1">service@paypa1-secure.com</span>&gt;</div>
    </div>
    <p class="ex-cap">Every verdict marks the message up like this. Each highlight ties to a numbered finding that names the trick and explains it.</p>

    <div class="steps">
      <div class="step"><div class="n">01</div><h3>Read it like it's yours</h3><p>Open the message. Hover any link to see where it truly points, and open <em>details &rarr; check the characters</em> when a domain looks right but feels wrong.</p></div>
      <div class="step"><div class="n">02</div><h3>Make the call</h3><p>Phishing or legitimate. Both kinds are in every level &mdash; flagging real mail is its own mistake.</p></div>
      <div class="step"><div class="n">03</div><h3>See the evidence</h3><p>The tells light up on the message itself, with an explanation for each one and a takeaway you can reuse.</p></div>
    </div>

    <div class="lv-head"><h2>Choose a level</h2><span>each one adds a trick the last one didn't use</span>
      ${Object.keys(S.answers).length ? '<button class="ghost" data-reset style="margin-left:auto">Start over</button>' : ''}</div>
    <div class="levels">${cards}</div>

    <p class="note"><b>For the classroom.</b> Every message is a simulation. Links are inert &mdash; nothing opens, nothing is submitted, and no data leaves this file. Brands are imitated for realistic training only; the companies here are not involved. Runs offline in any browser.</p>
  </div>`;
  document.body.dataset.view = 'start';
}

/* ============================================================
   Level view
   ============================================================ */
function renderLevel(){
  const L = lvl();
  const list = emails().map(e => {
    const ans = S.answers[e.id];
    const right = ans && ans === e.verdict;
    const chip = ans ? `<span class="i-chip ${right?'ok':'no'}">${right?'&check; called it':'&times; missed'}</span>` : '';
    return `<button class="item${ans?' answered':''}" data-open="${esc(e.id)}" aria-selected="${S.openId===e.id}">
      <span class="tile" style="background:${brandColor(e.brandKey)}">${esc((e.fromName||e.brand||'?').trim()[0]||'?')}</span>
      <span class="i-main">
        <span class="i-top"><span class="i-from">${esc(e.fromName)}</span><span class="i-date">${esc(e.date)}</span></span>
        <span class="i-sub">${esc(e.subject)}</span>
        <span class="i-pre">${esc(e.preview)}</span>
        ${chip}
      </span>
    </button>`;
  }).join('');

  app.innerHTML = railHtml() + `<div class="split">
    <aside class="list">
      <div class="list-head">
        <h2>Level ${L.level} &middot; ${esc(L.title)}</h2>
        <p>${esc(L.intro)}</p>
      </div>
      ${list}
    </aside>
    <section class="pane" id="pane">${paneHtml()}</section>
  </div>`;
  document.body.dataset.view = S.openId ? 'mail' : 'list';
  if(S.openId) afterPane();
}

function paneHtml(){
  const e = emails().find(x => x.id === S.openId);
  if(!e) return `<div class="empty"><p>Pick a message on the left to begin. Read it the way you'd read your own inbox &mdash; then call it.</p></div>`;

  const ans = S.answers[e.id];
  const showDetails = S.details[e.id] || (ans && e.tells.some(t => t.anchor === 'replyto'));
  const dom = (e.fromAddress.split('@')[1] || '').trim();

  const banner = !ans ? '' : (() => {
    const right = ans === e.verdict;
    const truth = e.verdict === 'phishing' ? 'This is phishing.' : 'This one is genuine.';
    const msg = right
      ? (e.verdict==='phishing' ? 'You spotted it. Here is what betrayed it:' : 'Correctly left alone. Here is what makes it trustworthy:')
      : (e.verdict==='phishing' ? 'This one slipped past. Look at what it was hiding:' : 'A false alarm &mdash; real mail flagged as phishing. Here is why it checks out:');
    return `<div class="banner ${right?'right':'wrong'}">
      <span class="bi">${right?'&check;':'!'}</span>
      <span><b>${right?'Correct.':'Not quite.'} ${truth}</b>${msg}</span></div>`;
  })();

  const details = `<div class="details" data-details${showDetails?'':' hidden'}>
      <div><span class="k">from:</span><span class="v" data-field="from">${esc(e.fromName)} &lt;${esc(e.fromAddress)}&gt;</span></div>
      ${e.replyTo?`<div><span class="k">reply-to:</span><span class="v" data-field="replyto">${esc(e.replyTo)}</span></div>`:''}
      <div><span class="k">to:</span><span class="v">Jordan Rivera &lt;j.rivera@northwind-trading.com&gt;</span></div>
      <div><span class="k">date:</span><span class="v" data-field="date">${esc(e.date)}</span></div>
      <div><span class="k">mailed-by:</span><span class="v" data-field="mailedby">${esc(dom)}</span></div>
      <button class="inspbtn" data-inspect>${S.inspect[e.id]?'&#9652; hide character check':'&#9026; check the characters'}</button>
      ${S.inspect[e.id] ? inspectHtml(e) : ''}
    </div>`;

  const verdictBar = ans ? '' : `<div class="verdict">
      <span class="q">Your call:</span>
      <button class="vbtn phish" data-verdict="phishing">&#127907; Phishing <span class="kbd">P</span></button>
      <button class="vbtn legit" data-verdict="legit">&#10003; Legitimate <span class="kbd">L</span></button>
    </div>`;

  return `<div class="pane-inner">
    ${banner}
    <div class="sheet" id="sheet" style="--bbrand:${brandColor(e.brandKey)}">
      <div class="sheet-top">
        <h1 data-field="subject">${esc(e.subject)}</h1>
        <div class="hrow">
          <span class="tile" style="background:${brandColor(e.brandKey)}">${esc((e.fromName||e.brand||'?').trim()[0]||'?')}</span>
          <div class="hmain">
            <div class="hline">
              <span class="hname">${esc(e.fromName)}</span>
              <span class="haddr" data-field="from">&lt;${esc(e.fromAddress)}&gt;</span>
              <span class="hdate" data-field="date">${esc(e.date)}</span>
            </div>
            <div class="hto">to me <button class="dtoggle" data-toggle-details>${showDetails?'&#9652; hide details':'&#9662; details'}</button></div>
            ${details}
          </div>
        </div>
      </div>
      <div class="mail" id="mailbody">${e.bodyHtml}</div>
    </div>
    ${ans ? findingsHtml(e) : ''}
    ${verdictBar}
  </div>`;
}

/* Number the evidence in reading order, so chip 1 is the first thing on the page
   and the findings list runs top-to-bottom however the content was authored. */
function orderedTells(e){
  const head = { subject:0, from:1, date:2, replyto:3, mailedby:4 };
  const at = a => {
    if(a in head) return head[a];
    const i = e.bodyHtml.indexOf('data-tell="' + a + '"');
    const j = e.bodyHtml.indexOf("data-tell='" + a + "'");
    const k = i < 0 ? j : (j < 0 ? i : Math.min(i, j));
    return 100 + (k < 0 ? 9999 : k);
  };
  return e.tells.slice().sort((x, y) => at(x.anchor) - at(y.anchor));
}

/* ---- Character check -------------------------------------------------------
   A look-alike domain is invisible in rendered mail, so the lab gives the student
   the move a real analyst makes: pull the address apart and read its characters.
   Available before answering, because a tell you cannot possibly see is not a test. */
function scriptOf(c){
  const n = c.codePointAt(0);
  if(n>=0x0400 && n<=0x04FF) return 'Cyrillic';
  if(n>=0x0370 && n<=0x03FF) return 'Greek';
  if(n>=0x0530 && n<=0x058F) return 'Armenian';
  if(n>=0x2000 && n<=0x206F) return 'invisible/spacing';
  return 'non-Latin';
}
function rawHost(u){ return String(u||'').replace(/^([a-z]+:)?\/\//i,'').split('/')[0].split('@').pop().split(':')[0]; }
function toAscii(h){ try{ return new URL('http://' + h).hostname; }catch(_){ return null; } }

function inspectRows(e){
  const rows = [{ what:'Sender domain', host:(e.fromAddress.split('@')[1]||'').trim() }];
  if(e.replyTo) rows.push({ what:'Reply-to domain', host:(e.replyTo.split('@')[1]||'').trim() });
  const box = document.createElement('div'); box.innerHTML = e.bodyHtml;
  const seen = {};
  box.querySelectorAll('[data-href]').forEach(a => {
    const h = rawHost(a.dataset.href);
    if(h && !seen[h]){ seen[h] = 1; rows.push({ what:'Link destination', host:h }); }
  });
  return rows;
}

function inspectHtml(e){
  const rows = inspectRows(e).map(r => {
    const ascii = toAscii(r.host);
    const odd = [...r.host].filter(c => c.charCodeAt(0) > 127);
    let verdict;
    if(odd.length){
      const list = odd.map(c => `<code>${esc(c)}</code> U+${c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')} ${scriptOf(c)}`).join(', ');
      verdict = `<div class="insp-bad">${odd.length} character${odd.length>1?'s':''} here ${odd.length>1?'are':'is'} not Latin: ${list}.` +
                (ascii && ascii !== r.host.toLowerCase() ? ` This name actually registers as <code>${esc(ascii)}</code>.` : '') + `</div>`;
    } else {
      verdict = `<div class="insp-ok">&check; All standard Latin characters.</div>`;
    }
    return `<div class="insp-row"><span class="insp-w">${esc(r.what)}</span><span class="insp-host">${esc(r.host)}</span>${verdict}</div>`;
  }).join('');
  return `<div class="insp"><div class="insp-h">Character check &mdash; what these names are really made of</div>${rows}</div>`;
}

/* The destination behind a marked link, so the finding names it outright. */
function tellHref(e, anchor){
  if(!/^t\d+$/i.test(anchor)) return null;
  const box = document.createElement('div');
  box.innerHTML = e.bodyHtml;
  const el = box.querySelector('[data-tell="' + anchor + '"]');
  if(el && el.dataset.href) return el.dataset.href;
  const inner = el && el.querySelector('[data-href]');
  return inner ? inner.dataset.href : null;
}

/* A domain built from look-alike Unicode resolves to a punycode name. Showing it
   after the verdict teaches the actual way to unmask a homograph. */
function asciiForm(str){
  if(!str || !/[^\x00-\x7F]/.test(str)) return null;
  const m = String(str).match(/[^\s<>"'(),:;]*[^\x00-\x7F][^\s<>"'(),:;]*/);
  if(!m) return null;
  let host = m[0].replace(/^([a-z]+:)?\/\//i,'').split('/')[0].split('@').pop().split(':')[0]
                 .replace(/[.,;!?]+$/,'');
  if(!host.includes('.')) return null;
  try{
    const ascii = new URL('http://' + host).hostname;
    return (ascii && ascii !== host.toLowerCase() && /^xn--|\.xn--/.test(ascii)) ? ascii : null;
  }catch(_){ return null; }
}

function findingsHtml(e){
  const green = e.verdict === 'legit';
  const rows = orderedTells(e).map((t,i) => `
    <div class="finding${green?' green':''}" data-n="${i+1}">
      <span class="fnum">${i+1}</span>
      <span>
        <span class="f-label">${esc(t.label)}</span>
        <span class="f-ev">${esc(t.evidence)}</span>
        <div class="f-exp">${esc(t.explanation)}</div>
        ${(() => { const h = tellHref(e, t.anchor); return h ? `<div class="f-dest"><span class="dl">Really goes to</span><span class="du">${esc(h)}</span></div>` : ''; })()}
        ${(() => {
            const a = asciiForm(t.evidence) || asciiForm(tellHref(e, t.anchor));
            return a ? `<div class="f-puny"><span class="pl">Not the domain it looks like</span><span class="pu">${esc(a)}</span></div>` : '';
          })()}
      </span>
    </div>`).join('');

  const idx = emails().findIndex(x => x.id === e.id);
  const nextUn = emails().find((x,j) => j > idx && !S.answers[x.id]) || emails().find(x => !S.answers[x.id]);
  const all = emails().every(x => S.answers[x.id]);
  const nav = `<div class="next">
    ${all
      ? `<button class="pbtn" data-debrief>Level ${lvl().level} debrief &rarr;</button>`
      : `<button class="pbtn" data-open="${esc(nextUn.id)}">Next message &rarr;</button>`}
    <button class="pbtn alt backbtn" data-back>&larr; Inbox</button>
  </div>`;

  return `<div class="findings">
    <div class="f-head">
      <h3>${green?'Why this one is safe':'What gave it away'}</h3>
      <span class="badge ${green?'legit':'phish'}">${green?'Legitimate':'Phishing'}</span>
    </div>
    ${rows}
    <div class="takeaway"><span class="tl">Takeaway</span><span>${esc(e.takeaway)}</span></div>
  </div>${nav}`;
}

/* ============================================================
   Forensic markup — the signature moment
   ============================================================ */
function afterPane(){
  const e = emails().find(x => x.id === S.openId);
  if(!e) return;
  const sheet = document.getElementById('sheet');
  if(!sheet) return;
  sheet.querySelectorAll('[data-href]').forEach(a => { a.setAttribute('tabindex','0'); a.setAttribute('role','link'); });
  if(S.answers[e.id]) applyMarkup(sheet, e);
}

function applyMarkup(scope, e){
  const kind = e.verdict === 'legit' ? 'green' : 'flagged';
  scope.classList.add('reveal');
  orderedTells(e).forEach((t,i) => {
    const n = i + 1;
    const el = /^t\d+$/i.test(t.anchor)
      ? scope.querySelector('[data-tell="' + t.anchor + '"]')
      : scope.querySelector('[data-field="' + t.anchor + '"]');
    if(!el) return;
    const node = wrapEvidence(el, t.evidence, n, kind) || markWhole(el, n, kind);
    if(node) node.style.animationDelay = (i * 75) + 'ms';
  });
  scope.querySelectorAll('.mk').forEach(m => {
    m.addEventListener('mouseenter', () => highlight(m.dataset.n, true));
    m.addEventListener('mouseleave', () => highlight(m.dataset.n, false));
  });
  document.querySelectorAll('.finding').forEach(f => {
    f.addEventListener('mouseenter', () => highlight(f.dataset.n, true));
    f.addEventListener('mouseleave', () => highlight(f.dataset.n, false));
  });
}

function highlight(n, on){
  document.querySelectorAll('.mk[data-n="'+n+'"]').forEach(m => m.classList.toggle('pulse', on));
  document.querySelectorAll('.finding[data-n="'+n+'"]').forEach(f => f.style.background = on ? 'var(--ink3)' : '');
}

/* Wrap just the offending substring, so the highlight lands on the evidence. */
function wrapEvidence(el, evidence, n, kind){
  if(!evidence) return null;
  const needle = String(evidence).trim();
  if(needle.length < 2) return null;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let node;
  while((node = walker.nextNode())){
    const i = node.nodeValue.toLowerCase().indexOf(needle.toLowerCase());
    if(i === -1) continue;
    const after = node.splitText(i);
    after.splitText(needle.length);
    const span = document.createElement('span');
    span.className = 'mk ' + kind;
    span.dataset.n = n;
    after.parentNode.insertBefore(span, after);
    span.appendChild(after);
    return span;
  }
  return null;
}

/* Fall back to marking the whole element (buttons, whole paragraphs). */
function markWhole(el, n, kind){
  const block = el.classList.contains('btn') || /^(P|DIV|UL|OL|LI|H1|H2|H3)$/.test(el.tagName);
  el.classList.add('mk', kind);
  if(block) el.classList.add('blk');
  el.dataset.n = n;
  return el;
}

/* ============================================================
   Debrief
   ============================================================ */
function renderDebrief(){
  const L = lvl();
  const points = L.debriefPoints.map(p => `<div class="dpoint"><span class="dk">&rarr;</span><span>${esc(p)}</span></div>`).join('');
  const rows = L.emails.map(e => {
    const right = S.answers[e.id] === e.verdict;
    return `<div class="rrow">
      <span class="rmark ${right?'ok':'no'}">${right?'&check;':'&times;'}</span>
      <span><span class="rsub">${esc(e.subject)}</span><span class="rtake">${esc(e.takeaway)}</span></span>
      <span class="rtag ${e.verdict==='phishing'?'phish':'legit'}">${e.verdict==='phishing'?'Phishing':'Legitimate'}</span>
    </div>`;
  }).join('');
  const more = S.li < LEVELS.length - 1;

  app.innerHTML = railHtml() + `<div class="debrief">
    <div class="eyebrow"><span class="mlabel">Level ${L.level} complete</span><span class="rule"></span></div>
    <h1>${esc(L.title)}</h1>
    <p class="sub">Here is what this level was teaching you to notice. The next one keeps all of it and adds something new.</p>
    <div class="dpoints">
      <div class="dh"><span class="mlabel">New tells in this level</span></div>
      ${points}
    </div>
    <div class="recap">
      <div class="dh"><span class="mlabel">Your calls</span></div>
      ${rows}
    </div>
    <div class="next">
      ${more ? `<button class="pbtn" data-goto="${S.li+1}">Level ${LEVELS[S.li+1].level}: ${esc(LEVELS[S.li+1].title)} &rarr;</button>` : `<button class="pbtn" data-home>Back to the briefing</button>`}
      <button class="pbtn alt" data-goto="${S.li}">Review this level</button>
    </div>
  </div>`;
  document.body.dataset.view = 'debrief';
  window.scrollTo(0,0);
}

/* ============================================================
   Router + events
   ============================================================ */
function render(){
  if(S.view === 'start') renderStart();
  else if(S.view === 'debrief') renderDebrief();
  else renderLevel();
}

function openEmail(id){
  S.openId = id;
  S.view = 'level';
  render();
  const p = document.getElementById('pane');
  if(p) p.scrollTop = 0;
}

function answer(v){
  const e = emails().find(x => x.id === S.openId);
  if(!e || S.answers[e.id]) return;
  S.answers[e.id] = v;
  render();
  const p = document.getElementById('pane');
  if(p) p.scrollTop = 0;
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-open],[data-goto],[data-home],[data-reset],[data-verdict],[data-debrief],[data-back],[data-toggle-details],[data-href]');
  if(!t) return;

  if(t.hasAttribute('data-href')){
    ev.preventDefault();
    showToast('Links are disabled in this simulator. This one really points to <b>' + esc(t.dataset.href) + '</b>');
    return;
  }
  if(t.hasAttribute('data-open')) return openEmail(t.dataset.open);
  if(t.hasAttribute('data-goto')){ S.li = +t.dataset.goto; S.openId = null; S.view = 'level'; return render(); }
  if(t.hasAttribute('data-home')){ S.view = 'start'; S.openId = null; return render(); }
  if(t.hasAttribute('data-back')){ S.openId = null; document.body.dataset.view = 'list'; return render(); }
  if(t.hasAttribute('data-verdict')) return answer(t.dataset.verdict);
  if(t.hasAttribute('data-debrief')){ S.view = 'debrief'; return render(); }
  if(t.hasAttribute('data-toggle-details')){ S.details[S.openId] = !S.details[S.openId]; return render(); }
  if(t.hasAttribute('data-inspect')){ S.inspect[S.openId] = !S.inspect[S.openId]; return render(); }
  if(t.hasAttribute('data-reset')){
    if(confirm('Clear every answer and start the lab over?')){ S.answers = {}; S.details = {}; S.inspect = {}; S.openId = null; S.view = 'start'; render(); }
  }
});

/* Hover any link to see its true destination — the habit this lab is teaching. */
const sb = document.getElementById('statusbar'), sbu = document.getElementById('sburl');
function showUrl(el){ if(!el) return; sbu.textContent = el.dataset.href; sb.hidden = false; }
function hideUrl(){ sb.hidden = true; }
document.addEventListener('mouseover', e => { const a = e.target.closest('[data-href]'); if(a) showUrl(a); });
document.addEventListener('mouseout',  e => { if(e.target.closest('[data-href]')) hideUrl(); });
document.addEventListener('focusin',   e => { const a = e.target.closest('[data-href]'); if(a) showUrl(a); });
document.addEventListener('focusout',  e => { if(e.target.closest('[data-href]')) hideUrl(); });

let toastT;
function showToast(html){
  const el = document.getElementById('toast');
  el.innerHTML = html; el.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 4200);
}

document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(S.view !== 'level') return;
  const k = e.key.toLowerCase();
  const list = emails(), i = list.findIndex(x => x.id === S.openId);

  if(k === 'p' || k === 'l'){
    if(S.openId && !S.answers[S.openId]){ e.preventDefault(); answer(k === 'p' ? 'phishing' : 'legit'); }
  } else if(k === 'j' || e.key === 'ArrowDown'){
    e.preventDefault(); openEmail(list[Math.min(list.length - 1, i + 1)].id);
  } else if(k === 'k' || e.key === 'ArrowUp'){
    e.preventDefault(); openEmail(list[Math.max(0, i - 1)].id);
  } else if(e.key === 'Escape'){
    S.openId = null; render();
  }
});

render();
</script>
